version: 2
# Version-update PRs are disabled for this project on purpose: the repo is a single-developer Android
# app and Dependabot's first pass opened 9 PRs at once, two of them major bumps of the Android Gradle
# Plugin (8 -> 9) and the Gradle wrapper (8 -> 9) which change the build DSL and cannot be merged
# blindly. Dependencies are updated deliberately, one at a time, with a build check.
#
# What stays on: security updates. `open-pull-requests-limit: 0` disables *version* updates only; a
# security advisory still opens a PR when Dependabot alerts are enabled (Settings -> Code security).
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels: [ci]
