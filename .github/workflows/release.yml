name: Release

# Publish an installable APK to GitHub Releases on every push to main.
#
# Distinct from `android-ci.yml` on purpose:
#   • CI answers "is this commit healthy?" and uploads throwaway APKs.
#   • This workflow answers "what do users install?" and is the update feed the
#     in-app updater reads (UpdateChecker -> /releases, newest tag > VERSION_NAME).
#
# Signing is the load-bearing detail. `app/build.gradle.kts` falls back to the DEBUG
# key when `keystore.properties` is absent, and an APK signed with a different key is
# rejected twice over: Android refuses the in-place update (INSTALL_FAILED_UPDATE_
# INCOMPATIBLE) and `UpdateInstaller.verifierCheck` refuses it first. So this workflow
# materialises the real release keystore from repository secrets and refuses to
# publish at all if signing did not actually use it.
#
# Version: the commit's own `appVersionCode`/`appVersionName` are published verbatim.
# A push that does not bump them will fail loudly instead of producing a "release"
# the updater can never offer — bump the version to ship.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # The keystore is a binary; secrets can only hold text, so it travels base64-encoded.
      - name: Materialise the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::configure the four signing secrets (see RELEASING.md)"; exit 1; }
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          # keystore.properties feeds build.gradle.kts. Never committed (see .gitignore).
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore/release.jks keystore.properties

      - name: Read the version from the build script
        id: ver
        run: |
          set -euo pipefail
          name=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'val appVersionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "building $name ($code)"

      # A release the updater cannot offer is worse than no release: it silently
      # drops off the feed (UpdateChecker only picks tags newer than the running
      # VERSION_NAME), so pushing a fix without a bump looks "published" but reaches
      # nobody. Fail here instead.
      - name: Refuse to publish a version that is not newer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          echo "latest published: '${latest:-none}' / this build: '$TAG'"
          if [ "$latest" = "$TAG" ]; then
            echo "::error::$TAG is already published. Bump appVersionName/appVersionCode in app/build.gradle.kts to ship a new release."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint (fails on errors)
        run: ./gradlew :app:lintRelease --no-daemon

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon

      # The whole point of this workflow: prove the APK is signed by the release key,
      # not by the debug fallback. Grepping `apksigner --print-certs` for the expected
      # digest is what turns "the build succeeded" into "this can actually update users".
      - name: Verify signature and publish artefact
        id: apk
        env:
          EXPECTED_SIGNER: ${{ secrets.RELEASE_SIGNER_SHA256 }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

          # setup-android does not put the build-tools binaries on PATH in later steps;
          # resolve the newest installed build-tools explicitly.
          bt=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $bt"

          signer=$("$bt/apksigner" verify --print-certs "$apk" \
            | grep -oP 'SHA-256 digest: \K[0-9a-fA-F]+' | head -1 | tr 'A-Z' 'a-z')
          echo "signer sha256: $signer"
          if [ -z "$EXPECTED_SIGNER" ]; then
            echo "::error::RELEASE_SIGNER_SHA256 is not set, so the signing key cannot be confirmed"
            exit 1
          fi
          expected=$(echo "$EXPECTED_SIGNER" | tr -d ':[:space:]' | tr 'A-Z' 'a-z')
          if [ "$signer" != "$expected" ]; then
            echo "::error::APK is signed by $signer but the release key is $expected — this would break every existing user's update path"
            exit 1
          fi
          echo "::notice::signed with the expected release key"

          # 16 KB page-size compliance is a distribution requirement; fail before publishing.
          "$bt/zipalign" -c -P 16 -v 4 "$apk" > /dev/null

          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "$sha" > "$apk.sha256"
          echo "sha256: $sha"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          # Notes come from the commit that triggered the build: the repository keeps
          # user-facing text in CHANGELOG.md, so the body starts from the commit message.
          {
            printf 'APK firmado con la clave de release. Instalable sobre cualquier versión anterior.\n\n'
            git log -1 --pretty=%B
          } > notes.md
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DDownloader v$VERSION ($CODE)" \
            --notes-file notes.md

      # Tokens are wiped even on failure; the runner is disposable but the practice
      # keeps a stray `set -x` or crash dump from carrying the keystore password.
      - name: Remove the signing material
        if: always()
        run: rm -rf keystore keystore.properties
